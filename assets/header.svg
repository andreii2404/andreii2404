<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Andrei Quias — mobile and web developer</title>
  <desc id="desc">A pine and ivory banner with Andrei's pixel AQ mark, floating geometric shapes, and the signature Ideas, made useful.</desc>
  <defs>
    <radialGradient id="light"><stop stop-color="#3a574d"/><stop offset="1" stop-color="#18332d"/></radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#f4efe6" opacity=".055"/></pattern>
    <g id="aq" fill="currentColor"><path d="M4 40V16H12V40ZM24 40V16H32V40ZM8 16V8H12V4H24V8H28V16H24V12H12V16ZM12 20H24V28H12ZM40 4H56V8H60V16H52V12H44V16H36V8H40ZM36 16H44V28H52V16H60V32H56V36H40V32H36ZM48 28H56V36H64V44H56V40H52V36H48Z"/></g>
    <g id="plus"><path d="M-12 0H12M0-12V12" stroke-width="5" fill="none"/></g>
    <g id="diamond"><rect x="-15" y="-15" width="30" height="30" stroke-width="4" fill="none" transform="rotate(25)"/></g>
  </defs>
  <rect width="1600" height="500" fill="url(#light)"/><rect width="1600" height="500" fill="url(#dots)"/>
  <path d="M24 60V24H60M1540 24H1576V60M24 440V476H60M1540 476H1576V440" stroke="#9b4d35" stroke-width="3" fill="none"/>
  <use href="#aq" transform="translate(58 44) scale(.8)" color="#f4efe6"/>
  <text x="126" y="70" fill="#d0d5cb" font-family="monospace" font-size="17" letter-spacing="2">ANDREI / PERSONAL SPACE</text>
  <text x="1537" y="70" text-anchor="end" fill="#bdc9be" font-family="monospace" font-size="16" letter-spacing="1.4">BASED IN THE PHILIPPINES</text>
  <g stroke="#d79a7e"><use href="#plus" transform="translate(144 158) rotate(15)"/><use href="#plus" transform="translate(1430 338) rotate(-12)"/><use href="#diamond" transform="translate(1385 180) scale(1.3)"/><circle cx="250" cy="363" r="13" stroke-width="3" fill="none"/><circle cx="1530" cy="251" r="9" stroke-width="3" fill="none"/></g>
  <g stroke="#a4baaa" fill="none"><use href="#diamond" transform="translate(217 236) scale(1.6)"/><use href="#diamond" transform="translate(1464 417) scale(.72)"/><use href="#plus" transform="translate(1264 104) scale(.7)"/><circle cx="93" cy="322" r="23" stroke-width="3"/><circle cx="1324" cy="374" r="20" stroke-width="3"/><path d="M302 126L284 144L302 162M1298 242L1316 260L1298 278" stroke-width="4"/><rect x="58" y="191" width="12" height="12" stroke-width="3"/></g>
  <g fill="#f4efe6" opacity=".55"><rect x="326" y="302" width="7" height="7"/><rect x="1250" y="310" width="8" height="8"/><rect x="1492" y="140" width="6" height="6"/><rect x="358" y="392" width="5" height="5"/><rect x="105" y="426" width="6" height="6"/><rect x="1190" y="401" width="5" height="5"/></g>
  <g fill="#d79a7e"><rect x="386" y="111" width="7" height="7"/><rect x="1489" y="298" width="7" height="7"/><rect x="164" y="414" width="5" height="5"/></g>
  <text x="800" y="163" text-anchor="middle" fill="#d0d5cb" font-family="monospace" font-size="21" letter-spacing="5">HI, I'M</text>
  <text x="800" y="272" text-anchor="middle" fill="#f4efe6" font-family="Arial,Helvetica,sans-serif" font-size="105" font-weight="700" letter-spacing="-4">ANDREI QUIAS<tspan fill="#d79a7e">.</tspan></text>
  <text x="800" y="324" text-anchor="middle" fill="#e2e5da" font-family="Arial,Helvetica,sans-serif" font-size="30" letter-spacing=".1">Mobile &amp; web developer</text>
  <rect x="771" y="365" width="8" height="8" fill="#9b4d35"/><rect x="786" y="365" width="8" height="8" fill="#d79a7e"/><rect x="801" y="365" width="8" height="8" fill="#e7d2bc"/><rect x="816" y="365" width="8" height="8" fill="#f4efe6"/>
  <text x="800" y="437" text-anchor="middle" fill="#d0d5cb" font-family="monospace" font-size="19" letter-spacing="2.3">IDEAS, MADE USEFUL.</text>
  <text x="64" y="458" fill="#a4baaa" font-family="monospace" font-size="12" letter-spacing="2">MOBILE / WEB / INTERACTIVE</text>
  <text x="1536" y="458" text-anchor="end" fill="#a4baaa" font-family="monospace" font-size="12" letter-spacing="2">THOUGHTFUL DESIGN. USEFUL BUILDS.</text>
</svg>
